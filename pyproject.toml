[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial_quant"
version = "0.0.4"
description = "Financial quantitative analysis tools"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # Core Data
    "numpy",
    "pandas==2.2.3", # Locked to Colab's working version
    "requests",
    "openpyxl",
    "python-dateutil",
    "pandas-datareader",
    "pandas_market_calendars==5.5.0", # Locked to Colab's working version
    "pyarrow >= 12.0.0",
    "matplotlib",
    "altair",
    "holidays",
    "pathvalidate",
    "html5lib",
    
    # Advanced Math & Stats
    "scipy",
    "statsmodels",
    # massive
    "massive"
]

[tool.setuptools.packages.find]
where = ["src"]
